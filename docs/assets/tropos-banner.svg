<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Tropos Code</title>
  <desc id="desc">The Tropos logo, the words Tropos Code, and the tagline: An agent that does the work for you.</desc>
  <defs>
    <!-- Brand blue to violet, the dashboard's accent and skills colours. -->
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4568ff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#4568ff"/>
      <stop offset="0.7" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1" r="0.75">
      <stop offset="0" stop-color="#4568ff" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#6d28d9" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#111111" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7d4ff"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1280" height="420" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="#111111"/>
    <rect width="1280" height="420" fill="url(#dots)"/>
    <rect width="1280" height="420" fill="url(#glow)"/>

    <!-- Atmospheric layers: the troposphere the name comes from, drawn as arcs over the horizon. -->
    <g fill="none" stroke="url(#band)">
      <ellipse cx="640" cy="1020" rx="1180" ry="660" stroke-width="2" stroke-opacity="0.55"/>
      <ellipse cx="640" cy="1050" rx="1080" ry="640" stroke-width="1.5" stroke-opacity="0.4"/>
      <ellipse cx="640" cy="1080" rx="980" ry="620" stroke-width="1" stroke-opacity="0.3"/>
      <ellipse cx="640" cy="1110" rx="880" ry="600" stroke-width="1" stroke-opacity="0.22"/>
      <ellipse cx="640" cy="1140" rx="780" ry="580" stroke-width="1" stroke-opacity="0.15"/>
      <ellipse cx="640" cy="1020" rx="1180" ry="660" stroke-width="10" stroke-opacity="0.25" filter="url(#soft)"/>
    </g>

    <!-- The T from web/public/brand, redrawn as paths (640 x 640 artboard), centred above the wordmark. -->
    <g transform="translate(640 98) scale(0.23) translate(-319.5 -319.5)" fill="url(#mark)">
      <path d="M190 126 H345 L266 204 H113 Z"/>
      <path d="M410 126 H526 L447 204 H347 V433 L266 513 V270 Z"/>
    </g>

    <g font-family="Inter, 'SF Pro Display', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="640" y="228" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#fafaf9">Tropos Code</text>
      <text x="640" y="286" font-size="30" font-weight="700" fill="#c7d4ff">An agent that does the work for you.</text>
      <text x="640" y="328" font-size="18" fill="#a8a29e">Talk to it from your terminal, your browser, your phone or Telegram. It plans, codes and learns, inside an OS sandbox.</text>
    </g>
  </g>
</svg>
