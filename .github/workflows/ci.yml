name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      # Grep tests run against ripgrep as well as the built-in fallback when rg is installed.
      - name: Install ripgrep
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ripgrep; else sudo apt-get install -y ripgrep; fi
      - name: Install shellcheck
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install shellcheck; else sudo apt-get install -y shellcheck; fi
      - run: shellcheck -s sh install.sh scripts/release/make-manifest.sh
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  build:
    name: build (all targets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build:all
