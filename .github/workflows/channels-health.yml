# .github/workflows/channels-health.yml — every 6 hours: check the channel pointers; repair on request (spec §7.4).
# The check is read-only. Repair writes slots to Tropos-AI/tropos-code-channels (CHANNELS_WRITE_TOKEN, environment
# channels-write; decision D1-B) and may set GitHub latest on Tropos-AI/tropos-code, so only it holds contents: write.
name: channels-health
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      repair:
        description: "Repair problems found"
        type: boolean
        default: false
permissions: {}
concurrency:
  group: channels
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name == 'schedule' || !inputs.repair
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Only from main
        run: '[ "$GITHUB_REF" = "refs/heads/main" ] || { echo "channels-health.yml runs only from main"; exit 1; }'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
          no-cache: true
          token: ""
      - env:
          GH_TOKEN: ${{ github.token }}
          CHANNELS_REPOSITORY: Tropos-AI/tropos-code-channels
        run: bun scripts/release/promote.ts check
  repair:
    if: github.event_name == 'workflow_dispatch' && inputs.repair
    runs-on: ubuntu-24.04
    environment: channels-write
    permissions:
      contents: write
    steps:
      - name: Only from main
        run: '[ "$GITHUB_REF" = "refs/heads/main" ] || { echo "channels-health.yml runs only from main"; exit 1; }'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
          no-cache: true
          token: ""
      - env:
          GH_TOKEN: ${{ github.token }}
          CHANNELS_REPOSITORY: Tropos-AI/tropos-code-channels
          CHANNELS_WRITE_TOKEN: ${{ secrets.CHANNELS_WRITE_TOKEN }}
        run: bun scripts/release/promote.ts check --repair
